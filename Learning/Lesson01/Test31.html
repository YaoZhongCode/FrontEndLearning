<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 31</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root{
            --card-bg:#ffffff;
            --primary-color: #1890ff;
        }
        .profile-card{
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            padding:24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar{
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
        }
        .avatar img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info{
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .name{
            font-size: 18px;
            font-weight: bold;
        }
        @media(max-width: 768px){
            .profile-card{
                flex-direction: column;
                align-items: center;
                text-align: center;
                background-color: #fafafa;
            }
            .avatar{
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar">
            <img src="Images/avatar02.jpg" alt="头像">
        </div>
        <div class="info">
            <div class="name">
                阿一
            </div>
            <div class="describe">
                职场上班族。
            </div>
        </div>
    </div>
</body>
</html>
