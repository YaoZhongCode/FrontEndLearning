<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My learning</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .product-list{
            width: 600px;
            margin: 40px auto;
            display: flex;
            gap: 20px;
        }
        .product-item{
            width: 290px;
            background-color: #ffffff;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
            cursor: pointer;
        }
        .product-item:hover{
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .img-wrapper{
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden; /* 確保放大的圖片不會超出頂部圓角 */
            border-radius: 10px 10px 0 0;
        }

        /* 修正 1：給 img 加上防拉伸與滿屏樣式 */
        .img-wrapper img{
            width: 100%;
            height: 100%;
            object-fit: cover; /* 關鍵：圖片等比例裁剪填充，絕不拉伸 */
            display: block;    /* 消除圖片底部預設縫隙 */
            transition: transform 0.4s;
        }

        /* 修正 2：懸停卡片時，僅放大內部的 img 圖片 */
        .product-item:hover .img-wrapper img{
            transform: scale(1.08);
        }

        .discount-tag{
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff4d4f;
            color: white; /* 修正 5：補上白色文字 */
            font-size: 12px;
            border-radius: 4px;
            padding: 2px 6px;
            z-index: 2;
        }

        /* 修正 3：設定縱向排列 */
        .info-box{
            padding: 12px;
            display: flex;
            flex-direction: column; /* 讓名稱和價格上下垂直排列 */
            gap: 8px;
        }
        .goods-name{
            font-size: 15px;
            color: #333333;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-now{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price{
            font-size: 18px;
            font-weight: bold;
            color: #f5222d;
        }
        .sales{
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="product-list">
        <!-- 卡片 1 -->
        <div class="product-item">
            <div class="img-wrapper">
                <img src="Images/earphone.jpg" alt="耳机">
                <div class="discount-tag">8.5折</div>
            </div>
            <div class="info-box">
                <!-- 修正 4：補上商品名稱文字 -->
                <div class="goods-name">無線藍牙降噪耳機 高音質長續航</div>
                <div class="price-now">
                    <div class="price">¥ 299</div>
                    <div class="sales">已售 1200+</div>
                </div>
            </div>
        </div>

        <!-- 卡片 2 -->
        <div class="product-item">
            <div class="img-wrapper">
                <img src="Images/Iphone.jpg" alt="手机">
                <div class="discount-tag">8.5折</div>
            </div>
            <div class="info-box">
                <!-- 修正 4：補上商品名稱文字 -->
                <div class="goods-name">旗艦智慧型手機 5G 全網通</div>
                <div class="price-now">
                    <div class="price">¥ 1299</div>
                    <div class="sales">已售 1200+</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
