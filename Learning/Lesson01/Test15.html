<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }
        .mask{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .modal{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background-color: #ffffff;
            border-radius: 12px;
            z-index: 20;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .modal-title{
            font-size: 18px;
            font-weight: bold;
        }
        .modal-text{
            font-size: 14px;
            color: #666666;
            text-align: center;
        }
        .confirm-btn{
            width: 120px;
            height: 38px;
            background-color: #1890ff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            line-height: 38px;
            transition: all 0.3s;
        }
        .confirm-btn:hover{
            background-color: #096dd9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="mask">
    </div>
    <div class="modal">
        <div class="modal-title">
            温馨提示
        </div>
        <div class="modal-text">
            您的账号已在其他设备登陆，请重新验证
        </div>
        <div class="confirm-btn">
            确认
        </div>
    </div>
</body>
</html>
