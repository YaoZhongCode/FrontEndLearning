<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 26</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root{
            --header-bg: #001529;
            --sidebar-bg: #002140;
            --main-bg: #f0f2f5;
        }
        .admin-layout{
            width: 640px;
            height: 360px;
            margin: auto;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eee;
            display: grid;
            grid-template-columns: 140px 1fr;
            grid-template-rows: 50px 1fr;
            grid-template-areas: 
                "header header"
                "sidebar main";
        }
        .header{
            grid-area: header;
            background-color: var(--header-bg);
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 50px;
        }
        .sidebar{
            grid-area: sidebar;
            background-color: var(--sidebar-bg);
            color: white;
            text-align: center;
            line-height: 310px;
        }
        .main{
            grid-area: main;
            background-color: var(--main-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="header">
            顶部栏
        </div>
        <div class="sidebar">
            侧边栏
        </div>
        <div class="main">
            后台数据展示区
        </div>
    </div>
</body>
</html>
