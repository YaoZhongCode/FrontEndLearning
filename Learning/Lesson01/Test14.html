<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .mask{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .modal{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 180px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 15px black;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
        }

        .modal-title{
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .modal-text{
            font-size: 14px;
            color: #666666;
            text-align: center;
        }

        .confirm-btn{
            width: 100px;
            height: 36px;
            background-color: #ff4d4f;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            line-height: 36px;
        }
        .confirm-btn:hover{
            background-color: #cf2a2d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="mask">
    </div>
    <div class="modal">
            <div class="modal-title">
                提示
            </div>
            <div class="modal-text">
                确认要删除此项目吗？
            </div>
            <button class="confirm-btn">
                确认
            </button>
        </div>
</body>
</html>
