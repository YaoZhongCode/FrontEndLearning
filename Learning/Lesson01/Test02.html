<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS learning</title>

    <style>
        p{
            color: red;
        }
        h1{
            color: blue;
        }
        .important{
            color: blue;
        }

        #notice{
            color: green;
        }

        .box{
            width: 200px;
            height: 100px;
            background-color: yellow;
        }

        .card{
            width: 300px;
            height: 150px;
            background-color: blue;
        }

        .title{
            font-size: 24px;
        }

        .notice{
            text-align: center;
        }

        .box{
            border: 1px solid black;
        }

        .card{
            padding: 15px;
        }
        .box{
            margin: 20px;
        }
    </style>
</head>

<body>
    <header>
        <h1>我的CSS学习</h1>
    </header>
    <p>这段文字会变成红色</p>

    <p class="important">重要提示</p>

    <p id="notice">友情提示</p>

    <div class="box">
        <p>背景区域</p>
    </div>

    <div class="card">
        <p>卡片</p>
    </div>

    <p class="title">放大字体</p>

    <p class="notice">公告内容</p>

    <div class="box">
        <p>边框盒子</p>
    </div>

    <div class="card">
        <p>卡片内容</p>
    </div>

    <div class="box">
        <p>外边距盒子</p>
    </div>
</body>
</html>
