<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 27</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .grid-container{
            width: 500px;
            height: 300px;
            margin: 20px auto;
            background-color: #f5f5f5;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr);
            place-items: center;
        }
        .item{
            width: 80px;
            height: 60px;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
            line-height: 60px;
            transition: all 0.3s;
        }
        .item:hover{
            transform: translateY(-4px);
            box-shadow: 0 3px 2px #333;
        }
        .item-special{
            width: 100px;
            height: 40px;
            background-color: #1890ff;
            color: white;
            border-radius: 6px;
            text-align: center;
            line-height: 40px;
            justify-self: end;
            align-self: end;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item">
            卡片1
        </div>
        <div class="item">
            卡片2
        </div>
        <div class="item">
            卡片3
        </div>
        <div class="item">
            卡片4
        </div>
        <div class="item">
            卡片5
        </div>
        <div class="item">
            卡片6
        </div>
        <div class="item">
            卡片7
        </div>
        <div class="item">
            卡片8
        </div>
        <div class="item-special">
            卡片9
        </div>
    </div>
</body>
</html>
