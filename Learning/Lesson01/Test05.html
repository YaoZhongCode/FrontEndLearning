<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>

    <style>
        .box{
            width: 100px;
            background-color: red;
            transition: width 0.5s;
        }
        .box:hover{
            width: 200px;
        }

        .btn{
            margin: 20px auto;
            width: 100px;
            background-color: blue;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        平滑过渡
    </div>

    <div class="btn">
        点击提交
    </div>
</body>
</html>
