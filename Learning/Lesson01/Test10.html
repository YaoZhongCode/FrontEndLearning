<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .btn-group{
            width: 500px;
            height: 80px;
            background-color: #f0f2f5;
            border-radius: 10px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .btn{
            width: 100px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            line-height: 40px;
            transition: all 0.3s;
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #d9d9d9;
        }

        .btn:hover{
            background-color: #1890ff;
            color: white;
            border: 1px solid #1890ff;
            transform: translateY(-5px);
        }

    </style>
</head>
<body>
    <div class="btn-group">
        <div class="btn">
            确认
        </div>
        <div class="btn">
            取消
        </div>
        <div class="btn">
            删除
        </div>
    </div>
</body>
</html>
