<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 21</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        input, button{
            border: none;
            outline: none;
            background: none;
        }
        .card{
            width: 340px;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            margin: 20px auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .author-bar{
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .author-avatar{
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
        }
        .author-avatar img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .author-info{
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 4px;
        }
        .name{
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .time{
            font-size: 12px;
            color: #999;
        }
        .read-btn button{
            width: 60px;
            height: 32px;
            background-color: #A0C4DF;
            color: black;
            font-size: 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .read-btn button:hover{
            background-color: #3899e3;
            color: #ffffff;
        }
        .read-btn button:active{
            transform: scale(0.94);
        }
        .post-content{
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .data-bar{
            display: flex;
            justify-content: space-between;
        }
        .read-data{
            font-size: 12px;
            color:#9c9c9c;
        }
        .like-data{
            font-size: 12px;
            color: #9c9c9c;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="author-bar">
            <div class="author-avatar">
                <img src="Images/avatar02.jpg" alt="头像">
            </div>
            <div class="author-info">
                <div class="name">阿一</div>
                <div class="time">2026-10-28 20:10</div>
            </div>
            <div class="read-btn">
                <button>阅读</button>
            </div>
        </div>
        <div class="post-content">
            新品预告！苹果凌晨预计将发布新品！苹果明天凌晨可能要发布首款带触控OLED的Macbook Pro，这也是Mac第一次用上触摸屏。
        </div>
        <div class="data-bar">
            <div class="read-data">已阅6000+</div>
            <div class="like-data">点赞213</div>
        </div>
    </div>
</body>
</html>
