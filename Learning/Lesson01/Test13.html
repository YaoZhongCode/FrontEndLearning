<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .contact-btn{
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 60px;
            height: 60px;
            background-color: #1890ff;
            color: white;
            font-size: 14px;
            border-radius: 50%;
            text-align: center;
            line-height: 60px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .contact-btn:hover{
            background-color: #096dd9;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px black;
        }

    </style>
</head>
<body>
    <div class="contact-btn">
        客服
    </div>
</body>
</html>
