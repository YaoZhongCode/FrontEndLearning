<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 18</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .product-grid{
            width: 600px;
            margin: 40px auto;
            display: flex;
            /*开启自动换行*/
            flex-wrap: wrap;
            gap: 20px;
        }
        .card{
            width: 290px;
            background-color: #ffffff;
            border-radius: 10px;
            border: 1px solid #eee;
            position: relative;
            display: flex;
            /*纵向布局*/
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }
        .img-box{
            width: 100%;
            height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
        }
        .img-box img{
            width: 100%;
            height: 100%;
            /*防止图片拉伸变形*/
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }
        .card:hover .img-box img{
            transform: scale(1.08);
        }
        .tag{
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff4d4f;
            color: white;
            font-size: 12px;
            border-radius: 4px;
            padding: 2px 6px;
            z-index: 2;
        }
        .content{
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .title{
            font-size: 14px;
            color: #333;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            /*溢出文字替换为省略号*/
            text-overflow: ellipsis;
        }
        .price-now{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price{
            font-size: 16px;
            font-weight: bold;
            color: #f5222d;
        }
        .sales{
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="product-grid">
            <!--卡片1-->
            <div class="card">
                <div class="img-box">
                    <img src="Images/watch.jpg" alt="手表">
                    <div class="tag">热销</div>
                </div>
                <div class="content">
                    <div class="title">旗舰智能手表 心率检测 运动记录 睡眠记录</div>
                    <div class="price-now">
                        <div class="price">¥ 2399</div>
                        <div class="sales">已售800+</div>
                    </div>
                </div>
            </div>
            <!--卡片2-->
            <div class="card">
                <div class="img-box">
                    <img src="Images/camera.jpg" alt="摄像机">
                    <div class="tag">热销</div>
                </div>
                <div class="content">
                    <div class="title">高清摄像机 可变光圈 随时记录美好生活 10倍长焦</div>
                    <div class="price-now">
                        <div class="price">¥ 9999</div>
                        <div class="sales">已售100+</div>
                    </div>
                </div>
            </div>
            <!--卡片3-->
            <div class="card">
                <div class="img-box">
                    <img src="Images/earphone.jpg" alt="耳机">
                    <div class="tag">热销</div>
                </div>
                <div class="content">
                    <div class="title">无线蓝牙降噪耳机 高品质长续航</div>
                    <div class="price-now">
                        <div class="price">¥ 1599</div>
                        <div class="sales">已售1200+</div>
                    </div>
                </div>
            </div>
            <!--卡片4-->
            <div class="card">
                <div class="img-box">
                    <img src="Images/Iphone.jpg" alt="手表">
                    <div class="tag">热销</div>
                </div>
                <div class="content">
                    <div class="title">旗舰智能手机 5G 全网通 大内存</div>
                    <div class="price-now">
                        <div class="price">¥ 5999</div>
                        <div class="sales">已售2000+</div>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
