<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 32</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root{
            --card-bg: #ffffff;
            --primary-color: #1890ff;
        }
        .product-grid{
            max-width: 1000px;
            width: 100%;
            margin: 20px auto;
            padding: 16px;
            background-color: #f5f5f5;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .product-card{
            height: 80px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        @media(min-width: 576px){
            .product-grid{
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .product-card{
                height: 100px;
            }
        }

        @media(min-width: 992px){
            .product-grid{
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .product-card{
                height: 120px;
                border-top: 2px solid transparent;
                transition: all 0.3s;
            }
            .product-card:hover{
                transform: translateY(-4px);
                box-shadow: 0 3px 2px #333;
                border-top: 2px solid var(--primary-color);
            }
        }
    </style>
</head>
<body>
    <div class="product-grid">
        <div class="product-card">
            产品1
        </div>
        <div class="product-card">
            产品2
        </div>
        <div class="product-card">
            产品3
        </div>
        <div class="product-card">
            产品4
        </div>
    </div>
</body>
</html>
