<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card{
            width: 280px;
            background-color: white;
            border-radius: 12px;
            border: 1px solid #eee;
            margin: 100px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover{
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        .img-box{
            width: 100%;
            height: 160px;
            background-color: #e0e0e0;
            position: relative;
            overflow: hidden;
            border-radius: 12px 12px 0 0;

        }
        .img{
            width: 100%;
            height: 100%;
            background-color: #1890ff;
            color: white;
            text-align: center;
            line-height: 160px;
            transition: transform 0.5s;
        }
        .card:hover .img{
            transform: scale(1.1);
        }
        .tag{
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 12px;
            border-radius: 4px;
            padding: 4px 8px;
            z-index: 2;
        }
        .content{
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .title{
            font-size: 16px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .describe{
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="img-box">
            <div class="img">
                封面图片
            </div>
            <div class="tag">
                精选
            </div>
        </div>
        <div class="content">
            <div class="title">
                CSS3 进阶实战：掌握现代 Web 前端 UI 布局技巧
            </div>
            <div class="describe">
                包含 Flex 布局、定位与动画过渡...
            </div>
        </div>
    </div>
</body>
</html>
