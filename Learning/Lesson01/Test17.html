<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My learning</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .product-list{
            width: 600px;
            margin: 40px auto;
            display: flex;
            gap: 20px;
        }
        .product-item{
            width: 290px;
            background-color: #ffffff;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
            cursor: pointer;
        }
        .product-item:hover{
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .img-wrapper{
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            border-radius: 10px 10px 0 0;
        }

        .img-wrapper img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .product-item:hover .img-wrapper img{
            transform: scale(1.08);
        }

        .discount-tag{
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff4d4f;
            color: white;
            font-size: 12px;
            border-radius: 4px;
            padding: 2px 6px;
            z-index: 2;
        }
        .info-box{
            padding:12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .goods-name{
            font-size: 15px;
            color: #333333;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-now{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price{
            font-size: 18px;
            font-weight: bold;
            color: #f5222d;
        }
        .sales{
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="product-list">
        <div class="product-item">
            <div class="img-wrapper">
                <img src="Images/earphone.jpg" alt="耳机">
                <div class="discount-tag">8.5折</div>
            </div>
            <div class="info-box">
                    <div class="goods-name">无线蓝牙降噪耳机 高品质长续航</div>
                    <div class="price-now">
                        <div class="price">¥ 299</div>
                        <div class="sales">已售 1600+</div>
                    </div>
            </div>
        </div>
        <div class="product-item">
            <div class="img-wrapper">
                <img src="Images/Iphone.jpg" alt="手机">
                <div class="discount-tag">8.5折</div>
            </div>
            <div class="info-box">
                    <div class="goods-name">旗舰智能手机 5G 全网通 大内存</div>
                    <div class="price-now">
                        <div class="price">¥ 1299</div>
                        <div class="sales">已售 1200+</div>
                    </div>
            </div>
        </div>
    </div>
</body>
</html>
