<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning 23</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root{
            --primary-color:#772ed1;
            --bg-card:#ffffff;
            --text-color:#1f1f1f;
            --border-color:#f0f0f0;
        }
        button{
            border: none;
            outline: none;
            background: none;
        }
        .setting-card{
            width: 320px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            margin: 20px auto;
        }
        .header{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title{
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
        }
        .save-btn button{
            font-size: 12px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .save-btn button:hover{
            background-color: #531d94;
        }
        .save-btn button:active{
            transform: scale(0.92);
        }
        .option-list{
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-item{
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-color);
        }
        .status-tag::before{
            display: inline-block;
            margin-right: 6px;
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgb(13, 202, 13);
        }
    </style>
</head>
<body>
    <div class="setting-card">
        <div class="header">
            <div class="title">
                选项
            </div>
            <div class="save-btn">
                <button>保存</button>
            </div>
        </div>
        <div class="option-list">
            <div class="option-item">
                推送通知
                <div class="status-tag">已开启</div>
            </div>
            <div class="option-item">
                深色模式
                <div class="status-tag">已开启</div>
            </div>
        </div>
    </div>
</body>
</html>
